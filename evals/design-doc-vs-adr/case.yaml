name: design-doc-vs-adr
description: "Record this decision" after a settled discussion fires adr (one file per decision), not design-doc.
difficulty: easy
max_turns: 8
timeout_seconds: 180
prompt: |
  We decided: events go through an outbox table in the service DB and a relay publishes to Kafka; we rejected dual-write and CDC. Record this as an ADR.
graders:
  - type: tool_used
    config:
      tool_name: Skill
  - type: file_exists
    config:
      path: docs/adr/0001-outbox-relay-for-events.md
  - type: llm
    config:
      instructions: Check the ADR structure.
      rubric: |
        - One ADR file with Context, Decision ("We will ..."), Consequences, Alternatives considered
        - Alternatives list dual-write and CDC with the reason each lost
        - Not a multi-section design document with options still open
