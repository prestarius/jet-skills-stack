name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI (for plugin validate)
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate
        run: scripts/validate.sh
